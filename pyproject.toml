[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "S",   # bandit security rules
    "C4",  # comprehensions
]
ignore = [
    "E501",  # line length is handled by the formatter
    "S101",  # assert is the expected idiom in tests
    "B008",  # FastAPI's Depends() in defaults is the framework's own pattern
]

[tool.ruff.lint.per-file-ignores]
# load_dotenv() must run before the imports that read the environment at module
# scope, so app.py's import block is intentionally not at the top of the file.
"app.py" = ["E402"]
"worker.py" = ["E402"]
"tests/conftest.py" = ["E402"]
# Tests legitimately use hardcoded credentials and bind to test hosts.
# S603: the migration tests shell out to alembic with a fixed argument list.
"tests/*" = ["S105", "S106", "S107", "S311", "S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import mode prepend keeps `import app` resolving to the repo root.
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
]
