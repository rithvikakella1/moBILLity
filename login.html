<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Sign in · moBILLity</title><link rel="stylesheet" href="/static/auth.css"></head>
<body><main class="wrap">
  <a class="logo" href="/">mo<span>BILL</span>ity</a>
  <section class="card">
    <h1>Welcome back</h1><p class="intro">Sign in to your secure medical coding workspace.</p>
    <div id="alert" class="alert" role="alert"></div>
    <a class="google" href="/auth/google"><span class="google-mark">G</span> Continue with Google</a>
    <div class="divider">or use your verified email</div>
    <form id="form">
      <label for="email">Email</label><input class="input" id="email" type="email" autocomplete="email" required>
      <div class="row"><label for="password">Password</label><a class="link" href="/forgot-password">Forgot password?</a></div>
      <input class="input" id="password" type="password" autocomplete="current-password" required>
      <button class="button" id="submit" type="submit">Sign in</button>
    </form>
    <p class="fine">Protected by rate limits, secure cookies, and encrypted connections.</p>
  </section>
  <p class="footer">New here? <a class="link" href="/signup">Create an account</a></p>
</main><script>
const alertBox=document.querySelector('#alert'),button=document.querySelector('#submit');async function payload(r){const t=await r.text();try{return JSON.parse(t)}catch{return{detail:r.ok?'Unexpected server response.':'The server could not complete the request. Please try again.'}}}
function show(message,type='error'){alertBox.textContent=message;alertBox.className=`alert show ${type}`}
const errors={google_failed:'Google sign-in was cancelled or failed.',google_unavailable:'Google sign-in is not configured yet.',google_unverified:'Google did not provide a verified email.',account_conflict:'That email is linked to another Google account.'};
const error=new URLSearchParams(location.search).get('error');if(error)show(errors[error]||'Sign-in failed.');
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;alertBox.className='alert';
 const body=new URLSearchParams({username:document.querySelector('#email').value.trim(),password:document.querySelector('#password').value});
 try{const response=await fetch('/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});const data=await payload(response);if(!response.ok)throw new Error(data.detail||'Sign-in failed.');location.href='/app'}
 catch(err){show(err.message);button.disabled=false}});
</script></body></html>
