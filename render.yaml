# Render blueprint. Previously the start command, Python version, and every
# environment variable lived only in the dashboard, so the deployment could not
# be reproduced from a clone or reviewed in a pull request.
services:
  - type: web
    name: mobillity-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Schema and code ship together.
    preDeployCommand: alembic upgrade head
    # --proxy-headers is load-bearing: without it the app sees http:// behind
    # Render's TLS-terminating balancer, which breaks Twilio signature
    # validation and collapses per-IP rate limiting into one global bucket.
    startCommand: >-
      uvicorn app:app
      --host 0.0.0.0
      --port $PORT
      --proxy-headers
      --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: ENVIRONMENT
        value: production
      # The dispatcher must run in exactly one process, so the web service
      # never enables it.
      - key: WORKFLOW_WORKER
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: mobillity-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SESSION_SECRET_KEY
        generateValue: true
      # Set by hand — must stay identical across deploys or stored patient data
      # becomes unreadable. Never use generateValue here.
      - key: ENCRYPTION_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: PRIVACY_CONTACT_EMAIL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: FRONT_DESK_PHONE_NUMBER
        sync: false
      - key: PRACTICE_NAME
        sync: false
      - key: COMMUNICATION_DELIVERY_MODE
        value: preview

  # The reminder dispatcher runs here and only here. Running it in every web
  # worker is how patients receive duplicate reminder calls.
  - type: worker
    name: mobillity-dispatcher
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: ENVIRONMENT
        value: production
      - key: WORKFLOW_WORKER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: mobillity-db
          property: connectionString
      - key: ENCRYPTION_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: SESSION_SECRET_KEY
        sync: false
      - key: PRIVACY_CONTACT_EMAIL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: PRACTICE_NAME
        sync: false
      - key: COMMUNICATION_DELIVERY_MODE
        sync: false

databases:
  - name: mobillity-db
    plan: basic-256mb
