"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[[redirects]]
  from = "/api/*"
  to = "https://mobillity-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/auth/*"
  to = "https://mobillity-api.onrender.com/auth/:splat"
  status = 200
  force = true

# Demo HTML is served only after the backend session check.
[[redirects]]
  from = "/demo"
  to = "https://mobillity-api.onrender.com/demo"
  status = 200
  force = true

# Demo HTML is served only after the backend session check.
[[redirects]]
