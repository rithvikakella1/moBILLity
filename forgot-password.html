<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Forgot password · moBILLity</title><link rel="stylesheet" href="/static/auth.css"></head>
<body><main class="wrap"><a class="logo" href="/">mo<span>BILL</span>ity</a><section class="card"><h1>Reset your password</h1><p class="intro">Enter your email. If it matches an account, we’ll send a one-time link.</p><div id="alert" class="alert" role="alert"></div><form id="form"><label for="email">Email</label><input class="input" id="email" type="email" autocomplete="email" required><button class="button" id="submit">Send reset link</button></form></section><p class="footer"><a class="link" href="/login">Back to sign in</a></p></main>
<script>const a=document.querySelector('#alert'),b=document.querySelector('#submit');async function payload(r){const t=await r.text();try{return JSON.parse(t)}catch{return{detail:r.ok?'Unexpected server response.':'The server could not complete the request. Please try again.'}}}document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();b.disabled=true;try{const r=await fetch('/api/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.querySelector('#email').value.trim()})});const d=await payload(r);a.textContent=d.message||d.detail;a.className=`alert show ${r.ok?'success':'error'}`}finally{b.disabled=false}})</script></body></html>
