<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Verify email · moBILLity</title><link rel="stylesheet" href="/static/auth.css"></head>
<body><main class="wrap"><a class="logo" href="/">mo<span>BILL</span>ity</a><section class="card"><h1>Verifying your email</h1><p class="intro">Please wait while we validate your one-time link.</p><div id="alert" class="alert show" role="alert">Checking link…</div></section><p class="footer"><a class="link" href="/login">Go to sign in</a></p></main>
<script>(async()=>{const a=document.querySelector('#alert'),token=new URLSearchParams(location.search).get('token')||'';try{const r=await fetch('/api/verify-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});const d=await r.json();a.textContent=d.message||d.detail;a.className=`alert show ${r.ok?'success':'error'}`}catch{a.textContent='Could not verify this link.';a.className='alert show error'}})()</script></body></html>
