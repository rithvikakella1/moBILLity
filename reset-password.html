<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Choose password · moBILLity</title><link rel="stylesheet" href="/static/auth.css"></head>
<body><main class="wrap"><a class="logo" href="/">mo<span>BILL</span>ity</a><section class="card"><h1>Choose a new password</h1><p class="intro">This link is single-use and expires after one hour.</p><div id="alert" class="alert" role="alert"></div><form id="form"><label for="password">New password</label><input class="input" id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><p class="requirements">Use 12–128 characters.</p><label for="confirm">Confirm password</label><input class="input" id="confirm" type="password" autocomplete="new-password" required><button class="button" id="submit">Update password</button></form></section><p class="footer"><a class="link" href="/login">Back to sign in</a></p></main>
<script>const a=document.querySelector('#alert'),b=document.querySelector('#submit'),token=new URLSearchParams(location.search).get('token')||'';document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const password=document.querySelector('#password').value;if(password!==document.querySelector('#confirm').value){a.textContent='Passwords do not match.';a.className='alert show error';return}b.disabled=true;try{const r=await fetch('/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password})});const d=await r.json();a.textContent=d.message||d.detail;a.className=`alert show ${r.ok?'success':'error'}`;if(r.ok)document.querySelector('#form').reset()}finally{b.disabled=false}})</script></body></html>
